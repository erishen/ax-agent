<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECFEFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ECFEFF" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background (squircle-look like macOS icons) -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#glass)"/>

  <!-- Magnifier: glass circle + handle -->
  <circle cx="234" cy="234" r="150" fill="none" stroke="#F0FDFA" stroke-width="34"/>
  <circle cx="234" cy="234" r="116" fill="#062E33" fill-opacity="0.35"/>
  <!-- handle at 45° down-right -->
  <line x1="340" y1="340" x2="430" y2="430" stroke="#F0FDFA" stroke-width="36" stroke-linecap="round"/>

  <!-- Accessibility person inside the glass -->
  <g fill="#F0FDFA">
    <circle cx="234" cy="176" r="34"/>
    <!-- torso with outstretched arms -->
    <path d="M 234 226
             C 210 226 190 236 190 258
             L 190 296
             C 190 306 197 313 207 313
             C 217 313 224 306 224 296
             L 224 276
             L 244 276
             L 244 296
             C 244 306 251 313 261 313
             C 271 313 278 306 278 296
             L 278 258
             C 278 236 258 226 234 226 Z"/>
  </g>
  <!-- Outstretched arms -->
  <g stroke="#F0FDFA" stroke-width="30" stroke-linecap="round" fill="none">
    <line x1="234" y1="248" x2="150" y2="236"/>
    <line x1="234" y1="248" x2="318" y2="236"/>
  </g>
  <!-- Spread legs -->
  <g stroke="#F0FDFA" stroke-width="30" stroke-linecap="round" fill="none">
    <line x1="234" y1="306" x2="192" y2="384"/>
    <line x1="234" y1="306" x2="276" y2="384"/>
  </g>

  <!-- Scan brackets: the four corners, subtle -->
  <g stroke="#99F6E4" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 92 148 L 92 104 Q 92 92 104 92 L 148 92"/>
    <path d="M 364 92 L 408 92 Q 420 92 420 104 L 420 148"/>
    <path d="M 420 364 L 420 408 Q 420 420 408 420 L 364 420"/>
    <path d="M 148 420 L 104 420 Q 92 420 92 408 L 92 364"/>
  </g>
</svg>
